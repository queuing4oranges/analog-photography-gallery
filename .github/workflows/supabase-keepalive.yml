name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 12 * * 1,4"   # Monday + Thursday (2x/week)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl --silent --show-error --fail-with-body \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "${{ secrets.SUPABASE_URL }}/rest/v1/albums?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
